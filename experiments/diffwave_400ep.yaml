# ═══════════════════════════════════════════════════════════════════════════
# DiffWave Diffusion – 400 Epochs
# ═══════════════════════════════════════════════════════════════════════════
# Replicates the original run_DiffWave_pipeline.py
#
# Run:  python run_experiments.py experiments/diffwave_400ep.yaml

#TODO update run

run_name: "diffwave_400_epochs"
base_dir: "../runs/runs_diffusion"
model_filename: "diffwave_model.pth"

# ---------------------------------------------------------------------------
# Global config: can be a file path OR an inline dict.
# Using a file path here (same as the original pipeline).
# ---------------------------------------------------------------------------
global_config: "../global_config.yaml"

# ---------------------------------------------------------------------------
# Features
# ---------------------------------------------------------------------------
# use_static: false  →  forces ALL columns to be treated as dynamic.
# This is the "configuration trick" from the original DiffWave pipeline:
# static values get repeated at every timestep, producing exactly 2 tensors
# from the loader:  Target [B, T, 1]  and  Condition [B, T, N_cond].
features:
  use_static: false

# ---------------------------------------------------------------------------
# Data
# ---------------------------------------------------------------------------
data:
  global_config_file: "../global_config.yaml"
  datasets:
    - class: AZT1D2025Dataset
      params:
        dataset_root: "../datasets/AZT1D2025/CGM Records"
        config_file: "../datasets/AZT1D2025/CGM Records/azt1d2025.yaml"
        patient_metadata_path: "../datasets/AZT1D2025/CGM Records/patient_metadata.yaml"
        logging_dir: "../datasets/AZT1D2025/prep_logs"
    - class: HUPA_UCMDataset
      params:
        dataset_root: "../datasets/HUPA-UCM Diabetes Dataset/Preprocessed"
        config_file: "../datasets/HUPA-UCM Diabetes Dataset/hupa-ucm.yaml"
        patient_metadata_path: "../datasets/HUPA-UCM Diabetes Dataset/patient_metadata.yaml"
        logging_dir: "../datasets/HUPA-UCM Diabetes Dataset/prep_logs"
  split:
    class: DataSplitter
    strategy: subject
    val_ratio: 0.15
    random_state: 42

# ---------------------------------------------------------------------------
# Normalization  ([-1, 1] for diffusion!)
# ---------------------------------------------------------------------------
normalization:
  class: MinMaxNormalizer
  feature_range: [-1, 1]

# ---------------------------------------------------------------------------
# Windowing
# ---------------------------------------------------------------------------
windowing:
  class: WindowBuilder
  params:
    batch_size: 384
    num_workers: 4
    # NOTE: static_cols is intentionally omitted here because
    #       features.use_static = false.  The runner won't inject them.
  train:
    seq_len: 288
    step: 12
    shuffle: true
  val:
    seq_len: 288
    step: 288
    shuffle: true

# ---------------------------------------------------------------------------
# Logger
# ---------------------------------------------------------------------------
logger:
  class: WandBLogger
  project_name: "CGM_Diffusion_Gen"

# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------
model:
  class: DiffWaveDiffusionModule
  params:
    input_dim: 1
    # cond_dim: auto-injected by runner from loader
    residual_channels: 64
    num_layers: 30
    cycle_length: 10
    timesteps: 1000
    lr: 2.0e-4

# ---------------------------------------------------------------------------
# Trainer
# ---------------------------------------------------------------------------
trainer:
  class: Trainer
  log_every_n_steps: 50
  val_check_interval: 10

# ---------------------------------------------------------------------------
# Training phases  (DiffWave = single phase)
# ---------------------------------------------------------------------------
training:
  phases:
    - name: null          # no phase switching needed
      max_epochs: 400
      callbacks:
        - class: GenerativeVisualizer
          params:
            every_n_epochs: 20

# ---------------------------------------------------------------------------
# Inference
# ---------------------------------------------------------------------------
inference:
  builder:
    class: FullSequenceBuilder
    params:
      batch_size: 1
      num_workers: 0
      allow_target_nan: true
  reconstructor:
    class: FullSequenceReconstructor
    params: {}
  orchestrator:
    class: SequenceInferenceOrchestrator
    params: {}
  generate:
    - split: val
      prefix: val_synthetic
      label: Validation
    - split: train
      prefix: train_synthetic
      label: Train
