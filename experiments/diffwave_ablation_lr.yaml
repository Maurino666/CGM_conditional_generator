# ═══════════════════════════════════════════════════════════════════════════
# DiffWave – Ablation: Learning Rate study
# ═══════════════════════════════════════════════════════════════════════════
# Demonstrates two features:
#   1. Inline global_config (no external YAML file needed)
#   2. Minimal config – only override what changes from a "base"
#
# Run:  python run_experiments.py experiments/diffwave_ablation_lr.yaml

#TODO update run

run_name: "diffwave_lr_1e-3"
base_dir: "../runs/runs_diffusion"
model_filename: "diffwave_model.pth"

# ---------------------------------------------------------------------------
# Global config defined INLINE (no file path needed)
# ---------------------------------------------------------------------------
global_config:
  schema:
    target_col: glucose
    static_cols: [age, sex, diabetes_type, bmi]
  normalization_ranges:
    glucose: [40, 400]

features:
  use_static: false

data:
  global_config_file: null      # not needed since global_config is inline
  datasets:
    - class: AZT1D2025Dataset
      params:
        dataset_root: "../datasets/AZT1D2025/CGM Records"
        config_file: "../datasets/AZT1D2025/CGM Records/azt1d2025.yaml"
        patient_metadata_path: "../datasets/AZT1D2025/CGM Records/patient_metadata.yaml"
        logging_dir: "../datasets/AZT1D2025/prep_logs"
        # When global_config is inline, global_config_file must be passed
        # to datasets that require it. You can set it here per-dataset:
        global_config_file: "../global_config.yaml"
  split:
    strategy: subject
    val_ratio: 0.15

normalization:
  class: MinMaxNormalizer
  feature_range: [-1, 1]

windowing:
  class: WindowBuilder
  params:
    batch_size: 384
    num_workers: 4
  train: { seq_len: 288, step: 12 }
  val:   { seq_len: 288, step: 288 }

model:
  class: DiffWaveDiffusionModule
  params:
    input_dim: 1
    residual_channels: 64
    num_layers: 30
    cycle_length: 10
    timesteps: 1000
    lr: 1.0e-3                  # <── the ablation variable

training:
  phases:
    - max_epochs: 400
      callbacks:
        - class: GenerativeVisualizer
          params: { every_n_epochs: 20 }
