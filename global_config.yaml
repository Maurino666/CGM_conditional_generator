options:
  max_small_gap: "30min" # max gap for target interpolation

schema: # information on global columns

  target_col: "glucose"
  time_col: "timestamp"

  metadata_cols:
    - "patient_id"

  dense_cols:
    - "glucose"
    - "total_insulin"
    - "basal_rate"
    - "heart_rate"
    - "steps"
    - "calories_burned"
    # TODO - "activity_level"
    # TODO - "sleep_quality_score"

  impulse_cols:
    - "bolus_total"
    - "bolus_correction"
    - "bolus_meal"
    - "carbs"

  category_cols:
    - "device_mode"
    - "bolus_type"
    - "glucose_source"

  static_cols:
    - "age"
    - "sex_m"
    - "hba1c"

  cond_a:
    - "total_insulin"
    - "carbs"

  cond_b:
    - "heart_rate"
    - "steps"
    - "calories_burned"

  dtypes:
    glucose: "float"
    basal_rate: "float"
    heart_rate: "int"

    calories_burned: "float"
    # TODO activity_level
    # TODO sleep_quality_score
    bolus_total: "float"
    bolus_correction: "float"
    bolus_meal: "float"
    carbs: "float"
    age: "float"
    sex_m: "bool"
    hba1c: "float"
    device_mode: "category"
    bolus_type: "category"
    glucose_source: "category"

  cond_cols:
    - "basal_rate"
    - "heart_rate"
    - "steps"
    - "calories_burned"
    - "total_insulin"
    - "bolus_total"
    - "bolus_correction"
    - "bolus_meal"
    - "carbs"
    - "age"
    - "sex_m"
    - "hba1c"

  derived_cols:
    - "tod_sin_24h"
    - "tod_cos_24h"

  normalization_ranges:
    age: [18.0, 80.0]
    hba1c: [3.0, 10.0]

